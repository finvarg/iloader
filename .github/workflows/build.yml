name: Build Watch iLoader for Windows
on:
  push:
    branches: ["fix/watch-login-20261014"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-watch-login-v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun i --frozen-lockfile
      - name: Resolve pinned Watch backend
        working-directory: src-tauri
        run: cargo update -p isideload
      - name: Test selective anisette reset
        working-directory: src-tauri
        run: cargo test --lib anisette_reset_tests
      - name: Build Windows application
        run: bun tauri build --config src-tauri/ci.conf.json
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-watch-login-fix
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: src-tauri/Cargo.lock
